name: Discover and publish
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ironglass-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test extraction and failure handling
        run: python -m unittest discover -s tests -v
      - name: Search indexed IMDb mentions
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python scripts/discover.py
      - name: Save discoveries and scan report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results.json scan-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update discovered IMDb mentions and scan status'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html results.json scan-status.json .nojekyll _site/
          cp -R static _site/static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: discover
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
